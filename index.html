<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>직장인 START 코인</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background:#f4f4f4;
  margin:0;
  padding:20px;
}

h2 {
  text-align:center;
}

.card {
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-top:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

/* START 버튼 */
.start-circle {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: linear-gradient(145deg, #111, #333);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: bold;
  margin: 40px auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  transition: transform 0.15s ease;
  cursor: pointer;
}

.start-circle:active {
  transform: scale(0.9);
}

.coin {
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #eee;
}

button {
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:15px;
}

.meta {
  font-weight:bold;
  margin-top:10px;
}

.badge {
  text-align:center;
  font-size:20px;
  margin-top:10px;
  font-weight:bold;
}

.history {
  font-size:12px;
  color:#777;
  margin-top:10px;
}
</style>
</head>

<body>

<h2>🪙 직장인 START 코인</h2>

<div class="card">

  <!-- START 버튼 -->
  <div class="start-circle" onclick="addCoin()" id="startBtn">
    START
  </div>

  <div id="coins"></div>

  <div class="meta" id="avg"></div>
  <div class="meta" id="streak"></div>
  <div class="badge" id="grade"></div>
  <div class="meta" id="burnout"></div>

  <button onclick="share()">SNS 공유</button>
  <button onclick="nextWeek()" style="background:#555;">다음 주 시작</button>
  <button onclick="resetAll()" style="background:#999;">전체 리셋</button>

  <div class="history" id="history"></div>

</div>

<script>

const MAX = 5;
const dayMap = ["일","월","화","수","목","금","토"];

const coinsPool = [
  {name:"😎 칼퇴 성공 코인", score:95, rarity:"SSR"},
  {name:"🔥 집중 몰입 코인", score:85, rarity:"SR"},
  {name:"🙂 정상 근무 코인", score:70, rarity:"R"},
  {name:"🥲 버티기 코인", score:55, rarity:"R"},
  {name:"😵 야근 확정 코인", score:30, rarity:"UC"},
  {name:"💀 멘탈 붕괴 코인", score:10, rarity:"UR"}
];

function getCoins(){
  return JSON.parse(localStorage.getItem("coins") || "[]");
}

function setCoins(data){
  localStorage.setItem("coins", JSON.stringify(data));
}

function getHistory(){
  return JSON.parse(localStorage.getItem("history") || "[]");
}

function setHistory(data){
  localStorage.setItem("history", JSON.stringify(data));
}

function getStreak(coins){
  return coins.length;
}

function getStreakBonus(coins){
  if(coins.length >= 5) return 10;
  if(coins.length >= 3) return 5;
  return 0;
}

function avg(coins){
  if(!coins.length) return 0;
  let base = coins.reduce((a,b)=>a+b.score,0)/coins.length;
  return Math.round(base + getStreakBonus(coins));
}

function grade(avgScore){
  if(avgScore >= 85) return "🏆 S 등급";
  if(avgScore >= 70) return "🥇 A 등급";
  if(avgScore >= 50) return "🥈 B 등급";
  return "🥉 C 등급";
}

function burnout(avgScore){
  if(avgScore >= 80) return "🔥 번아웃 LOW";
  if(avgScore >= 50) return "⚠️ 보통";
  return "🚨 HIGH 위험";
}

function addCoin(){

  let coins = getCoins();
  const now = new Date();
  const day = dayMap[now.getDay()];

  const pick = coinsPool[Math.floor(Math.random()*coinsPool.length)];

  coins.push({
    day,
    name: pick.name,
    score: pick.score,
    rarity: pick.rarity,
    date: now.toISOString()
  });

  if(coins.length > MAX){
    coins = coins.slice(coins.length - MAX);
  }

  setCoins(coins);

  // 🔥 진동 효과
  if (navigator.vibrate) {
    navigator.vibrate(80);
  }

  render();
}

function nextWeek(){
  let coins = getCoins();
  let history = getHistory();

  if(coins.length){
    history.push(coins);
  }

  setHistory(history);
  setCoins([]);
  render();
}

function resetAll(){
  localStorage.removeItem("coins");
  localStorage.removeItem("history");
  render();
}

function share(){
  const coins = getCoins();
  const a = avg(coins);

  const text =
`🪙 직장인 START 코인

평균: ${a}
등급: ${grade(a)}
${burnout(a)}

#직장인코인`;

  if(navigator.share){
    navigator.share({text});
  } else {
    alert(text);
  }
}

function render(){

  const coins = getCoins();
  const history = getHistory();

  const box = document.getElementById("coins");
  box.innerHTML = "";

  coins.forEach(c=>{
    box.innerHTML += `
      <div class="coin">
        <span>[${c.day}] ${c.name}</span>
        <span>${c.score} (${c.rarity})</span>
      </div>
    `;
  });

  const a = avg(coins);

  document.getElementById("avg").innerText = "평균 점수: " + a;
  document.getElementById("streak").innerText = "기록: " + coins.length + "일";
  document.getElementById("grade").innerText = grade(a);
  document.getElementById("burnout").innerText = burnout(a);

  document.getElementById("history").innerText =
    "이전 주 저장: " + history.length + "주";
}

render();

</script>

</body>
</html>
