<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#07090d;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow:hidden;
}

/* 공통 */

.screen{
  width:100vw;
  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  position:relative;
  padding:24px;
}

.hidden{
  display:none;
}

button{
  border:none;
  outline:none;
  cursor:pointer;
  color:white;
  font-family:inherit;
}

/* 배경 */

.bg{
  position:absolute;
  width:700px;
  height:700px;
  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(120,140,255,.18),
  transparent 70%);

  filter:blur(80px);

  animation:bgMove 8s ease-in-out infinite;
}

@keyframes bgMove{

  0%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.1);
  }

  100%{
    transform:scale(1);
  }

}

/* 랜딩 */

.logo{
  position:relative;
  z-index:2;

  font-size:12px;
  letter-spacing:8px;
  opacity:.45;

  margin-bottom:40px;
}

.hero-coin{

  width:240px;
  height:240px;

  border-radius:50%;

  position:relative;
  z-index:2;

  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.35),
  transparent 60%),

  linear-gradient(145deg,
  #1d2433,
  #0b0d12);

  box-shadow:
  0 60px 120px rgba(0,0,0,.8),
  inset 0 1px 0 rgba(255,255,255,.08);

  animation:float 5s ease-in-out infinite;
}

.hero-coin::before{

  content:"";

  position:absolute;

  width:180%;
  height:180%;

  top:-40%;
  left:-40%;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );

  transform:rotate(25deg);

}

@keyframes float{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-14px);
  }

  100%{
    transform:translateY(0px);
  }

}

.hero-text{
  font-size:18px;
  letter-spacing:4px;
  font-weight:200;
}

.sub{
  margin-top:40px;

  opacity:.55;
  font-size:14px;

  z-index:2;
}

.start-btn{

  margin-top:28px;

  width:180px;
  height:56px;

  border-radius:999px;

  background:
  linear-gradient(145deg,
  #232838,
  #141821);

  letter-spacing:3px;

  box-shadow:
  0 20px 50px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.06);

  transition:.25s;

  z-index:2;
}

.start-btn:hover{
  transform:translateY(-2px);
}

/* 질문 */

.progress{

  position:absolute;
  top:70px;

  width:70%;
  height:4px;

  background:rgba(255,255,255,.08);

  border-radius:999px;
  overflow:hidden;

}

.progress-fill{

  width:0%;
  height:100%;

  background:
  linear-gradient(90deg,
  #9ea8ff,
  #ffffff);

  transition:.35s;

}

.question-box{

  width:100%;
  max-width:450px;

  padding:42px 30px;

  border-radius:32px;

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.04),
  transparent 60%),

  linear-gradient(145deg,
  #11141c,
  #090b10);

  box-shadow:
  0 30px 80px rgba(0,0,0,.7),
  inset 0 1px 0 rgba(255,255,255,.04);

  text-align:center;

  animation:fadeUp .5s ease;

}

@keyframes fadeUp{

  0%{
    opacity:0;
    transform:translateY(14px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }

}

.question-number{

  font-size:12px;
  letter-spacing:3px;
  opacity:.4;

}

.question-text{

  margin-top:28px;

  font-size:24px;
  line-height:1.5;
  font-weight:250;

}

.answer-wrap{

  margin-top:40px;

  display:flex;
  gap:14px;

}

.answer-btn{

  flex:1;
  height:56px;

  border-radius:18px;

  background:
  linear-gradient(145deg,
  #1a2030,
  #10131a);

  letter-spacing:2px;
  font-size:13px;

  transition:.25s;

}

.answer-btn:hover{
  transform:translateY(-2px);
}

/* 결과 */

.result-wrap{

  position:relative;

  display:flex;
  flex-direction:column;
  align-items:center;

}

.result-coin{

  width:320px;
  height:320px;

  border-radius:50%;

  position:relative;

  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 60px 120px rgba(0,0,0,.85),
  inset 0 1px 0 rgba(255,255,255,.08);

  animation:float 5s ease-in-out infinite;

}

.result-coin::before{

  content:"";

  position:absolute;

  width:180%;
  height:180%;

  top:-40%;
  left:-40%;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.12),
    transparent
  );

  transform:rotate(25deg);

}

/* 꽃가루 */

.sparkles{

  position:absolute;
  inset:0;

  overflow:hidden;
  pointer-events:none;

}

.spark{

  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  background:white;

  opacity:.8;

  animation:sparkFloat linear infinite;

}

@keyframes sparkFloat{

  0%{
    transform:translateY(100px) scale(.2);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:translateY(-500px) scale(1);
    opacity:0;
  }

}

.result-rarity{

  font-size:11px;
  letter-spacing:5px;
  opacity:.7;

}

.result-name{

  margin-top:18px;

  font-size:26px;
  letter-spacing:2px;
  font-weight:200;

  text-align:center;

}

.result-desc{

  margin-top:18px;

  font-size:13px;
  line-height:1.5;

  opacity:.65;

  text-align:center;

  width:75%;

}

.result-buttons{

  margin-top:40px;

  display:flex;
  gap:14px;

}

.action-btn{

  width:170px;
  height:52px;

  border-radius:999px;

  background:
  linear-gradient(145deg,
  #222838,
  #141821);

  letter-spacing:2px;

  box-shadow:
  0 20px 40px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.06);

  transition:.25s;

}

.action-btn:hover{
  transform:translateY(-2px);
}

/* 등급별 */

.common{

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.25),
  transparent 60%),

  linear-gradient(145deg,
  #4b5563,
  #111827);

}

.rare{

  background:
  radial-gradient(circle at top,
  rgba(180,210,255,.35),
  transparent 60%),

  linear-gradient(145deg,
  #647dff,
  #111827);

}

.epic{

  background:
  radial-gradient(circle at top,
  rgba(210,140,255,.4),
  transparent 60%),

  linear-gradient(145deg,
  #5b21b6,
  #12081f);

}

.legendary{

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.5),
  transparent 60%),

  linear-gradient(145deg,
  #000000,
  #2a0b3f);

  box-shadow:
  0 0 60px rgba(180,120,255,.4),
  0 60px 120px rgba(0,0,0,.85);

}

@media(max-width:500px){

  .result-coin{
    width:280px;
    height:280px;
  }

  .question-text{
    font-size:20px;
  }

  .result-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<!-- 랜딩 -->

<section id="landing" class="screen">

  <div class="bg"></div>

  <div class="logo">
    DAILY COIN
  </div>

  <div class="hero-coin">

    <div class="hero-text">
      TODAY
    </div>

  </div>

  <div class="sub">
    오늘의 감정 코인을 획득하세요
  </div>

  <button class="start-btn" onclick="startQuiz()">
    START
  </button>

</section>

<!-- 질문 -->

<section id="quiz" class="screen hidden">

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="question-box">

    <div class="question-number" id="questionNumber"></div>

    <div class="question-text" id="questionText"></div>

    <div class="answer-wrap">

      <button class="answer-btn" onclick="answer(0)">
        NO
      </button>

      <button class="answer-btn" onclick="answer(1)">
        YES
      </button>

    </div>

  </div>

</section>

<!-- 결과 -->

<section id="result" class="screen hidden">

  <div class="result-wrap" id="captureArea">

    <div class="sparkles" id="sparkles"></div>

    <div class="result-coin" id="resultCoin">

      <div class="result-rarity" id="resultRarity"></div>

      <div class="result-name" id="resultName"></div>

      <div class="result-desc" id="resultDesc"></div>

    </div>

  </div>

  <div class="result-buttons">

    <button class="action-btn" onclick="saveCoin()">
      SAVE
    </button>

    <button class="action-btn" onclick="restartQuiz()">
      RETRY
    </button>

  </div>

</section>

<script>

/* 질문 */

const questionPool = [

"출근 생각만 해도 피곤하다",
"혼자 있고 싶은 날이 많다",
"쉬어도 회복이 느리다",
"감정 기복이 심해진 느낌이다",
"사람들과 대화가 귀찮다",
"생각이 너무 많아진다",
"자꾸 멍해지는 순간이 있다",
"업무가 버겁게 느껴진다",
"예전보다 의욕이 줄었다",
"하루가 너무 빨리 소모된다",
"잠을 자도 개운하지 않다",
"지금은 천천히 가고 싶다",
"감정 소비가 커진 느낌이다",
"회복이 필요한 느낌이다",
"혼자 조용히 쉬고 싶다",
"무기력한 순간이 많다",
"아무 생각 없이 있고 싶다",
"미래 생각이 조금 막막하다",
"쉬는 날에도 긴장이 남아있다",
"생각 정리가 잘 안 된다"

]

/* 코인 */

const coins = [

{
  name:"SILENT COIN",
  rarity:"COMMON",
  class:"common",
  desc:"혼자만의 시간이 필요한 상태"
},

{
  name:"CLOUD COIN",
  rarity:"COMMON",
  class:"common",
  desc:"마음이 조금 흐려진 상태"
},

{
  name:"MOON COIN",
  rarity:"RARE",
  class:"rare",
  desc:"새벽 감성이 강해진 흐름"
},

{
  name:"RECOVERY COIN",
  rarity:"RARE",
  class:"rare",
  desc:"회복이 시작되는 상태"
},

{
  name:"CHAOS COIN",
  rarity:"EPIC",
  class:"epic",
  desc:"생각과 감정이 폭주하는 흐름"
},

{
  name:"DREAM COIN",
  rarity:"EPIC",
  class:"epic",
  desc:"현실보다 감정이 커진 상태"
},

{
  name:"ECLIPSE COIN",
  rarity:"LEGENDARY",
  class:"legendary",
  desc:"감정 흐름이 완전히 뒤바뀌는 순간"
}

]

let questions = []
let current = 0
let score = 0

/* 시드 */

function getSeed(){

  const d = new Date()

  return d.getFullYear()
  + d.getMonth()
  + d.getDate()

}

/* 셔플 */

function seededShuffle(array, seed){

  const arr = [...array]

  for(let i = arr.length - 1; i > 0; i--){

    const j = Math.floor(
      ((Math.sin(seed + i) * 10000) % 1 + 1) % 1 * (i + 1)
    )

    ;[arr[i], arr[j]] = [arr[j], arr[i]]

  }

  return arr

}

/* 질문 생성 */

function generateQuestions(){

  questions =
  seededShuffle(questionPool, getSeed())
  .slice(0,15)

}

/* 시작 */

function startQuiz(){

  generateQuestions()

  current = 0
  score = 0

  document
  .getElementById('landing')
  .classList.add('hidden')

  document
  .getElementById('quiz')
  .classList.remove('hidden')

  renderQuestion()

}

/* 질문 */

function renderQuestion(){

  document
  .getElementById('questionNumber')
  .innerText =
  `${current + 1} / ${questions.length}`

  document
  .getElementById('questionText')
  .innerText =
  questions[current]

  const percent =
  (current / questions.length) * 100

  document
  .getElementById('progressFill')
  .style.width =
  `${percent}%`

}

/* 답 */

function answer(v){

  score += v
  current++

  if(current < questions.length){

    renderQuestion()

  }else{

    showResult()

  }

}

/* 결과 */

function showResult(){

  document
  .getElementById('quiz')
  .classList.add('hidden')

  document
  .getElementById('result')
  .classList.remove('hidden')

  const rand = Math.random() * 100

  let selected

  if(rand < 2){

    selected = coins.find(c=>c.rarity==="LEGENDARY")

  }else if(rand < 10){

    const epic =
    coins.filter(c=>c.rarity==="EPIC")

    selected =
    epic[Math.floor(Math.random()*epic.length)]

  }else if(rand < 30){

    const rare =
    coins.filter(c=>c.rarity==="RARE")

    selected =
    rare[Math.floor(Math.random()*rare.length)]

  }else{

    const common =
    coins.filter(c=>c.rarity==="COMMON")

    selected =
    common[Math.floor(Math.random()*common.length)]

  }

  const coin =
  document.getElementById('resultCoin')

  coin.className =
  `result-coin ${selected.class}`

  document
  .getElementById('resultRarity')
  .innerText =
  selected.rarity

  document
  .getElementById('resultName')
  .innerText =
  selected.name

  document
  .getElementById('resultDesc')
  .innerText =
  selected.desc

  makeSparkles(selected.rarity)

}

/* 꽃가루 */

function makeSparkles(rarity){

  const wrap =
  document.getElementById('sparkles')

  wrap.innerHTML = ""

  let count = 20

  if(rarity==="RARE") count = 35
  if(rarity==="EPIC") count = 55
  if(rarity==="LEGENDARY") count = 90

  for(let i=0;i<count;i++){

    const s =
    document.createElement('div')

    s.className = "spark"

    s.style.left =
    Math.random()*100 + "%"

    s.style.top =
    Math.random()*100 + "%"

    s.style.animationDuration =
    3 + Math.random()*4 + "s"

    s.style.animationDelay =
    Math.random()*2 + "s"

    s.style.width =
    4 + Math.random()*8 + "px"

    s.style.height =
    s.style.width

    wrap.appendChild(s)

  }

}

/* 저장 */

function saveCoin(){

  html2canvas(
    document.getElementById('captureArea'),
    {
      backgroundColor:null,
      scale:4
    }
  ).then(canvas=>{

    const link =
    document.createElement('a')

    link.download =
    'daily-coin.png'

    link.href =
    canvas.toDataURL()

    link.click()

  })

}

/* 다시 */

function restartQuiz(){

  document
  .getElementById('result')
  .classList.add('hidden')

  document
  .getElementById('landing')
  .classList.remove('hidden')

}

</script>

</body>
</html>
