<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>START 코인 번아웃 테스트</title>

<style>
body {
  font-family: sans-serif;
  background:#f4f4f4;
  text-align:center;
  padding:20px;
}

.hidden { display:none; }

.card {
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-top:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

/* START 버튼 */
.start-btn {
  width:180px;
  height:180px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  font-weight:bold;
  margin:40px auto;
  cursor:pointer;
  transition:0.2s;
}

.start-btn:active {
  transform:scale(0.92);
}

/* 진행바 */
.progress {
  height:10px;
  background:#ddd;
  border-radius:10px;
  overflow:hidden;
  margin:10px 0;
}

.progress-fill {
  height:100%;
  width:0%;
  background:#111;
  transition:0.3s;
}

/* 버튼 */
button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:15px;
}

.coin-box {
  margin-top:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="card">
  <h2>🪙 START 코인 테스트</h2>
  <div class="start-btn" onclick="startQuiz()">START</div>
</div>

<!-- QUIZ -->
<div id="quiz" class="card hidden">

  <div id="questionNumber"></div>

  <div class="progress">
    <div id="progressFill" class="progress-fill"></div>
  </div>

  <h3 id="questionText"></h3>

  <button onclick="answer(1)">🙂 좋음</button>
  <button onclick="answer(2)">😐 보통</button>
  <button onclick="answer(3)">😵 힘듦</button>

</div>

<!-- RESULT -->
<div id="result" class="card hidden">

  <h2 id="resultState"></h2>
  <h3 id="resultScore"></h3>
  <p id="resultDesc"></p>

  <div class="coin-box" id="coinText"></div>

  <button onclick="restart()">다시하기</button>

</div>

<script>

let current = 0;
let score = 0;

let questions = [];
let coins = [];

const coinPool = [
  "😎 칼퇴 성공 코인",
  "🔥 집중 몰입 코인",
  "🙂 정상 근무 코인",
  "🥲 버티기 코인",
  "💀 멘탈 붕괴 코인"
];

const results = [
  {min:0, max:4, state:"🟢 안정", desc:"컨디션 좋음"},
  {min:5, max:8, state:"🟡 주의", desc:"조금 피로"},
  {min:9, max:12, state:"🔴 위험", desc:"번아웃 위험"}
];

/* START */
function startQuiz(){
  questions = [
    "오늘 출근 어땠나요?",
    "업무 스트레스는?",
    "퇴근 후 상태는?",
    "회사 생각이 드나요?"
  ];

  current = 0;
  score = 0;
  coins = [];

  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  renderQuestion();
}

/* 질문 */
function renderQuestion(){
  document.getElementById('questionNumber').innerText =
    `${current + 1} / ${questions.length}`;

  document.getElementById('questionText').innerText =
    questions[current];

  const percent = (current / questions.length) * 100;
  document.getElementById('progressFill').style.width = percent + "%";
}

/* 답변 */
function answer(value){

  score += value;

  // 🪙 코인 생성
  coins.push(coinPool[Math.floor(Math.random()*coinPool.length)]);

  current++;

  if(current < questions.length){
    renderQuestion();
  }else{
    showResult();
  }
}

/* 결과 */
function showResult(){

  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const result = results.find(r => score >= r.min && score <= r.max);

  document.getElementById('resultState').innerText = result.state;
  document.getElementById('resultScore').innerText = "점수: " + score;
  document.getElementById('resultDesc').innerText = result.desc;

  document.getElementById('coinText').innerText =
    "획득 코인: " + coins.join(" · ");
}

/* 다시 */
function restart(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}

</script>

</body>
</html>
