<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #faf7ff, #ffffff);
  font-family: -apple-system, sans-serif;
  overflow: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hidden { display: none; }

/* ===================== */
/* 🪙 COIN */
/* ===================== */

.hero-coin,
.result-coin {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  position: relative;

  background: radial-gradient(circle at 30% 30%,
    #ffffff 0%,
    #eef2f7 35%,
    #cfd6e0 65%,
    #aab4c0 100%);

  box-shadow:
    inset 0 14px 22px rgba(255,255,255,0.9),
    inset 0 -18px 25px rgba(0,0,0,0.15),
    0 25px 60px rgba(0,0,0,0.18);

  transform: perspective(900px) rotateX(12deg);
  animation: float 4s ease-in-out infinite;

  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* 두께 */
.hero-coin::before,
.result-coin::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.7),
    rgba(120,130,150,0.25),
    rgba(60,70,90,0.35)
  );
  transform: translateY(6px);
}

/* 빛 */
.hero-coin::after,
.result-coin::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.6),
    transparent
  );
  transform: rotate(25deg);
  animation: shine 4s linear infinite;
}

/* 애니메이션 */
@keyframes float {
  0% { transform: perspective(900px) rotateX(12deg) translateY(0px); }
  50% { transform: perspective(900px) rotateX(12deg) translateY(-10px); }
  100% { transform: perspective(900px) rotateX(12deg) translateY(0px); }
}

@keyframes shine {
  0% { transform: translateX(-120%) rotate(25deg); }
  100% { transform: translateX(120%) rotate(25deg); }
}

/* ===================== */
/* START */
/* ===================== */

.logo {
  font-size: 14px;
  letter-spacing: 6px;
  color: #7b5cff;
  margin-bottom: 20px;
}

.start-btn {
  margin-top: 30px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #b794f4, #7b5cff);
  color: white;
  border: none;
  cursor: pointer;
}

/* ===================== */
/* QUIZ */
/* ===================== */

.box {
  width: 85%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(123,92,255,0.1);
  text-align: center;
}

.question {
  font-size: 20px;
  margin: 20px 0;
}

.btns {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  height: 50px;
  border-radius: 14px;
  background: linear-gradient(145deg, #b794f4, #7b5cff);
  color: white;
  border: none;
  cursor: pointer;
}

/* ===================== */
/* RESULT (🔥 핵심 수정) */
/* ===================== */

.result-coin {
  width: 280px;
  height: 280px;

  /* 🔥 핵심: 세로 정렬 고정 */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;

  gap: 8px;
}

/* 텍스트 정렬 */
#state {
  font-size: 14px;
  letter-spacing: 3px;
  opacity: 0.7;
}

#score {
  font-size: 56px;
  font-weight: 200;
  color: #7b5cff;
}

#desc {
  font-size: 13px;
  opacity: 0.6;
}

/* 버튼 */
.action {
  margin-top: 20px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #b794f4, #7b5cff);
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <div class="logo">DAILY COIN</div>
  <div class="hero-coin"></div>
  <button class="start-btn" onclick="startQuiz()">START</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div class="box">
    <div id="num"></div>
    <div class="question" id="q"></div>

    <div class="btns">
      <button class="btn" onclick="answer(0)">NO</button>
      <button class="btn" onclick="answer(1)">YES</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div class="result-coin" id="capture">
    <div id="state"></div>
    <div id="score"></div>
    <div id="desc"></div>
  </div>

  <button class="action" onclick="save()">SAVE</button>
  <button class="action" onclick="restart()">RETRY</button>

</div>

<script>

/* 질문 */
const pool = [
"오늘 기분 어때?",
"에너지 충분해?",
"스트레스 있었어?",
"쉬고 싶었어?",
"집중 잘 됐어?",
"피곤했어?",
"사람 만나는 거 어땠어?",
"일 부담됐어?",
"의욕 있었어?",
"휴식 필요해?",
"하루 만족해?"
];

let qs = [];
let i = 0;
let s = 0;

/* START */
function startQuiz(){
  qs = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
  i = 0;
  s = 0;

  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  render();
}

/* 질문 */
function render(){
  document.getElementById('num').innerText = `${i+1}/${qs.length}`;
  document.getElementById('q').innerText = qs[i];
}

/* 답변 */
function answer(v){
  s += v;
  i++;

  if(i < qs.length){
    render();
  } else {
    result();
  }
}

/* 결과 */
function result(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const percent = Math.round((s / qs.length) * 100);

  let state = "";
  let desc = "";

  if(percent < 40){
    state = "STABLE";
    desc = "좋은 흐름이에요 🌿";
  } else if(percent < 70){
    state = "BALANCE";
    desc = "조금 쉬어도 좋아요 ☕";
  } else {
    state = "CRITICAL";
    desc = "휴식이 필요합니다 💭";
  }

  document.getElementById('state').innerText = state;
  document.getElementById('score').innerText = percent + "%";
  document.getElementById('desc').innerText = desc;
}

/* 저장 */
function save(){
  html2canvas(document.getElementById('capture')).then(c=>{
    let a = document.createElement('a');
    a.download = "daily-coin.png";
    a.href = c.toDataURL();
    a.click();
  });
}

/* 리셋 */
function restart(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}

</script>

</body>
</html>
