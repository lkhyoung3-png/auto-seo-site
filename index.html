<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: linear-gradient(135deg, #f7f5ff, #ffffff);
  font-family: -apple-system, sans-serif;
  overflow: hidden;
}

/* 화면 */
.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hidden { display: none; }

/* ===================== */
/* 🪙 COIN (핵심 업그레이드) */
/* ===================== */

.hero-coin,
.result-coin {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  position: relative;

  background: radial-gradient(circle at 30% 30%,
    #ffffff 0%,
    #f6f1ff 30%,
    #d9c9ff 55%,
    #b59cff 100%);

  box-shadow:
    inset 0 12px 25px rgba(255,255,255,0.9),
    inset -10px -10px 25px rgba(155,93,229,0.25),
    0 40px 90px rgba(155,93,229,0.18);

  display: flex;
  justify-content: center;
  align-items: center;

  transform-style: preserve-3d;
  animation: floatCoin 4s ease-in-out infinite;
  overflow: hidden;
}

/* 금속 빛 반사 */
.hero-coin::before,
.result-coin::before {
  content: "";
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;

  background: linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.7),
    transparent
  );

  transform: rotate(25deg);
  animation: shine 4s linear infinite;
}

/* 중앙 엠블럼 */
.hero-coin::after,
.result-coin::after {
  content: "DC";
  position: absolute;
  font-size: 34px;
  font-weight: 300;
  color: rgba(155,93,229,0.75);
  letter-spacing: 4px;
}

/* 떠있는 3D 느낌 */
@keyframes floatCoin {
  0% {
    transform: translateY(0px) rotateX(10deg) rotateY(0deg);
  }
  50% {
    transform: translateY(-10px) rotateX(10deg) rotateY(18deg);
  }
  100% {
    transform: translateY(0px) rotateX(10deg) rotateY(0deg);
  }
}

/* 빛 이동 */
@keyframes shine {
  0% { transform: translateX(-100%) rotate(25deg); }
  100% { transform: translateX(100%) rotate(25deg); }
}

/* ===================== */
/* START 화면 */
/* ===================== */

.logo {
  font-size: 14px;
  letter-spacing: 6px;
  color: #9b5de5;
  margin-bottom: 20px;
}

.start-btn {
  margin-top: 30px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
  border: none;
}

/* ===================== */
/* QUESTION */
/* ===================== */

.box {
  width: 85%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(155,93,229,0.1);
  text-align: center;
}

.question {
  font-size: 20px;
  margin: 20px 0;
}

.btns {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  height: 50px;
  border-radius: 14px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
  border: none;
}

/* ===================== */
/* RESULT */
/* ===================== */

.result-coin {
  width: 280px;
  height: 280px;
}

.score {
  font-size: 52px;
  color: #9b5de5;
}

.desc {
  font-size: 13px;
  opacity: 0.6;
  margin-top: 10px;
}

.action {
  margin-top: 20px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
  border: none;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <div class="logo">DAILY COIN</div>
  <div class="hero-coin"></div>
  <button class="start-btn" onclick="startQuiz()">START</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div class="box">
    <div id="num"></div>
    <div class="question" id="q"></div>

    <div class="btns">
      <button class="btn" onclick="answer(0)">좋음</button>
      <button class="btn" onclick="answer(1)">보통</button>
      <button class="btn" onclick="answer(2)">힘듦</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div class="result-coin" id="capture">
    <div id="state"></div>
    <div class="score" id="score"></div>
    <div class="desc" id="desc"></div>
  </div>

  <button class="action" onclick="save()">SAVE</button>
  <button class="action" onclick="restart()">RETRY</button>

</div>

<script>

/* 질문 */
const pool = [
"오늘 기분 어때?",
"에너지 충분해?",
"스트레스 있었어?",
"쉬고 싶었어?",
"집중 잘 됐어?",
"피곤했어?",
"사람 만나는 거 어땠어?",
"일 부담됐어?",
"감정 기복 있었어?",
"무기력했어?",
"의욕 있었어?",
"내일 기대돼?",
"긴장했어?",
"휴식 필요해?",
"하루 만족해?"
];

let qs = [];
let i = 0;
let s = 0;

/* START */
function startQuiz(){
  qs = [...pool].sort(() => Math.random() - 0.5).slice(0, 15);

  i = 0;
  s = 0;

  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  render();
}

/* 질문 */
function render(){
  document.getElementById('num').innerText = `${i+1}/15`;
  document.getElementById('q').innerText = qs[i];
}

/* 답변 */
function answer(v){
  s += v;
  i++;

  if(i < qs.length){
    render();
  } else {
    result();
  }
}

/* 결과 */
function result(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const percent = Math.round((s / (qs.length*2)) * 100);

  let state = "";
  let desc = "";

  if(percent < 40){
    state = "STABLE";
    desc = "좋은 흐름이에요 🌸";
  } else if(percent < 70){
    state = "WARNING";
    desc = "조금 쉬어가도 좋아요 ☕";
  } else {
    state = "CRITICAL";
    desc = "휴식이 필요합니다 💭";
  }

  document.getElementById('state').innerText = state;
  document.getElementById('score').innerText = percent + "%";
  document.getElementById('desc').innerText = desc;
}

/* 저장 */
function save(){
  html2canvas(document.getElementById('capture')).then(c=>{
    let a = document.createElement('a');
    a.download = "coin.png";
    a.href = c.toDataURL();
    a.click();
  });
}

/* 리셋 */
function restart(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}

</script>

</body>
</html>
