<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#f6f4ff;
}

.screen{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.hidden{display:none;}

button{
  padding:12px 20px;
  border:none;
  border-radius:999px;
  background:#7b5cff;
  color:white;
  margin-top:10px;
  cursor:pointer;
}

.coin{
  width:200px;
  height:200px;
  border-radius:50%;
  background:linear-gradient(145deg,#e8e8ff,#cfc7ff);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <h1>DAILY COIN</h1>
  <button onclick="start()">START</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div id="q"></div>
  <button onclick="ans(0)">좋음</button>
  <button onclick="ans(1)">보통</button>
  <button onclick="ans(2)">나쁨</button>
  <button onclick="ans(3)">최악</button>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">
  <div class="coin">
    <div id="level"></div>
    <div id="score"></div>
  </div>

  <div id="desc"></div>

  <button onclick="restart()">RETRY</button>
</div>

<script>

/* ===================== */
/* DATA */
/* ===================== */

const qlist=[
"오늘 기분 어때?","에너지 상태는?","스트레스 있었어?","피곤했어?","집중 잘 됐어?"
];

let i=0;
let s=0;

/* ===================== */
/* START (핵심) */
/* ===================== */

function start(){

  console.log("START OK");

  i=0;
  s=0;

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  next();
}

/* ===================== */
/* QUESTION */
/* ===================== */

function next(){
  document.getElementById("q").innerText = qlist[i];
}

/* ===================== */
/* ANSWER */
/* ===================== */

function ans(v){
  s += v;
  i++;

  if(i < qlist.length){
    next();
  } else {
    show();
  }
}

/* ===================== */
/* RESULT */
/* ===================== */

function show(){

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let percent = Math.round((s/(qlist.length*3))*100);

  let level="GOOD";
  if(percent>70) level="CRITICAL";
  else if(percent>40) level="NORMAL";

  document.getElementById("level").innerText = level;
  document.getElementById("score").innerText = percent + "%";
  document.getElementById("desc").innerText = "오늘 상태: " + level;
}

/* ===================== */
/* RESTART */
/* ===================== */

function restart(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("start").classList.remove("hidden");
}

</script>

</body>
</html>
