<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daily Medal</title>

<style>
body {
  font-family: -apple-system, sans-serif;
  background: linear-gradient(135deg, #f7f5ff, #ffffff);
  margin: 0;
  padding: 20px;
  text-align: center;
  color: #333;
}

.hidden { display:none; }

/* 카드 */
.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-top: 20px;
  box-shadow: 0 10px 25px rgba(155, 93, 229, 0.08);
}

/* START 버튼 */
.start-btn {
  width: 170px;
  height: 170px;
  border-radius: 50%;
  margin: 40px auto;
  background: linear-gradient(135deg, #cdb4ff, #9b5de5);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

.start-btn:active {
  transform: scale(0.95);
}

/* 버튼 */
button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #9b5de5;
  color: white;
  font-size: 15px;
}

/* 진행바 */
.progress {
  height: 8px;
  background: #eee;
  border-radius: 10px;
  overflow: hidden;
  margin: 10px 0;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #cdb4ff, #9b5de5);
  transition: 0.3s;
}

/* 메달 */
.medal {
  width: 120px;
  height: 120px;
  margin: 20px auto;
  border-radius: 50%;
  background: radial-gradient(circle, #cdb4ff, #9b5de5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  color: white;
  box-shadow: 0 10px 25px rgba(155, 93, 229, 0.3);
}

.history {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 15px;
}

.day {
  width: 50px;
  height: 50px;
  border-radius: 14px;
  background: #f3f0ff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="card">
  <h2>💜 Daily Medal</h2>
  <p>오늘의 감정을 기록해보세요</p>
  <div class="start-btn" onclick="startQuiz()">START</div>
</div>

<!-- QUIZ -->
<div id="quiz" class="card hidden">

  <div id="questionNumber"></div>

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <h3 id="questionText"></h3>

  <button onclick="answer(0)">😊 좋아요</button>
  <button onclick="answer(1)">😐 보통이에요</button>
  <button onclick="answer(2)">😔 힘들어요</button>

</div>

<!-- RESULT -->
<div id="result" class="card hidden">

  <h2 id="modeText"></h2>
  <p id="percentText"></p>
  <p id="descText"></p>

  <div class="medal" id="medalIcon">🏅</div>

  <h3>5일 기록</h3>
  <div class="history" id="history"></div>

  <button onclick="restart()">다시하기</button>
</div>

<script>

let current = 0;
let score = 0;
let questions = [];
let answers = [];

const questionPool = [
  "오늘 기분은 어땠나요?",
  "에너지가 충분했나요?",
  "사람들과의 관계는 어땠나요?",
  "혼자 있고 싶었나요?",
  "일이 부담스러웠나요?",
  "휴식이 필요하다고 느꼈나요?",
  "오늘 웃을 일이 있었나요?",
  "스트레스는 어느 정도였나요?",
  "마음이 편안했나요?",
  "하루가 길게 느껴졌나요?",
  "감정 기복이 있었나요?",
  "오늘 집중이 잘 됐나요?",
  "몸이 피곤했나요?",
  "내일이 기대되나요?",
  "스스로를 잘 챙겼나요?"
];

function startQuiz(){
  questions = [...questionPool]
    .sort(() => Math.random() - 0.5)
    .slice(0, 15);

  current = 0;
  score = 0;

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  render();
}

function render(){
  document.getElementById("questionNumber").innerText =
    `${current + 1} / ${questions.length}`;

  document.getElementById("questionText").innerText =
    questions[current];

  let percent = (current / questions.length) * 100;
  document.getElementById("progressFill").style.width = percent + "%";
}

function answer(val){
  score += val;
  current++;

  if(current < questions.length){
    render();
  } else {
    result();
  }
}

function result(){

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  let max = questions.length * 2;
  let percent = Math.round((score / max) * 100);

  let mode = "";
  let desc = "";
  let icon = "🏅";

  if(percent <= 40){
    mode = "💜 STABLE MODE";
    desc = "오늘은 안정적인 하루였어요 🌸";
    icon = "🌸";
  } else if(percent <= 70){
    mode = "💜 BALANCE MODE";
    desc = "조금의 휴식이 필요해요 ☕";
    icon = "🌙";
  } else {
    mode = "💜 CARE MODE";
    desc = "충분한 휴식이 필요합니다 💭";
    icon = "💔";
  }

  document.getElementById("modeText").innerText = mode;
  document.getElementById("percentText").innerText = percent + "%";
  document.getElementById("descText").innerText = desc;
  document.getElementById("medalIcon").innerText = icon;

  saveHistory(icon);
  renderHistory();
}

function saveHistory(icon){
  let history = JSON.parse(localStorage.getItem("medal") || "[]");

  let today = new Date().getDate();

  history.push({day: today, icon});

  if(history.length > 5){
    history = history.slice(history.length - 5);
  }

  localStorage.setItem("medal", JSON.stringify(history));
}

function renderHistory(){
  let history = JSON.parse(localStorage.getItem("medal") || "[]");

  let html = "";
  history.forEach(h => {
    html += `<div class="day">${h.icon}</div>`;
  });

  document.getElementById("history").innerHTML = html;
}

function restart(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("start").classList.remove("hidden");
}

renderHistory();

</script>

</body>
</html>
