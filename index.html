<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>직장인 START 코인</title>

<style>
body{
  <!-- trigger-pages -->
  FORCE-CHANGE-2026-OK
  margin:0;
  font-family:sans-serif;
  background:#f5f5f5;
  text-align:center;
}

h2{
  margin-top:30px;
  font-size:22px;
}

/* START 원형 버튼 */
.start-circle{
  width:160px;
  height:160px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:30px auto;
  font-size:18px;
  font-weight:bold;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
  cursor:pointer;
  user-select:none;
}

/* 카드 */
.card{
  background:#fff;
  margin:20px;
  padding:15px;
  border-radius:15px;
  box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.coin{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.meta{
  margin-top:10px;
  font-size:14px;
  color:#333;
}

button{
  width:80%;
  max-width:300px;
  padding:12px;
  margin:6px auto;
  display:block;
  border:none;
  border-radius:10px;
  font-size:15px;
}

.reset{ background:#999; color:#fff; }
.share{ background:#2d6cdf; color:#fff; }
.next{ background:#555; color:#fff; }
</style>
</head>

<body>

<h2>🪙 직장인 START 코인</h2>

<div class="start-circle" onclick="makeCoin()" id="startBtn">
START
</div>

<div class="card">
  <div id="list"></div>

  <div class="meta" id="avg"></div>
  <div class="meta" id="grade"></div>
  <div class="meta" id="burnout"></div>
</div>

<button class="next" onclick="nextWeek()">다음 주 이동</button>
<button class="share" onclick="share()">SNS 공유</button>
<button class="reset" onclick="resetAll()">리셋</button>

<script>

const MAX = 5;

const dayMap = ["일","월","화","수","목","금","토"];

const coinsPool = [
  {name:"😎 칼퇴 성공 코인", score:95},
  {name:"😐 생존 코인", score:70},
  {name:"🥲 버티기 코인", score:60},
  {name:"😵 야근 코인", score:30},
  {name:"💀 멘탈 붕괴 코인", score:10}
];

function getCoins(){
  return JSON.parse(localStorage.getItem("coins") || "[]");
}

function setCoins(data){
  localStorage.setItem("coins", JSON.stringify(data));
}

/* START 클릭 */
function makeCoin(){

  let coins = getCoins();

  const now = new Date();
  const day = dayMap[now.getDay()];

  const pick = coinsPool[Math.floor(Math.random()*coinsPool.length)];

  coins.push({
    day,
    name: pick.name,
    score: pick.score
  });

  if(coins.length > MAX){
    coins = coins.slice(coins.length - MAX);
  }

  setCoins(coins);
  render();

  document.getElementById("startBtn").innerText = pick.name;
}

/* 평균 */
function avg(list){
  if(!list.length) return 0;
  return Math.round(list.reduce((a,b)=>a+b.score,0)/list.length);
}

/* 등급 */
function grade(a){
  if(a>=85) return "🏆 S";
  if(a>=70) return "🥇 A";
  if(a>=50) return "🥈 B";
  return "🥉 C";
}

/* 번아웃 */
function burnout(a){
  if(a>=80) return "🔥 안정";
  if(a>=50) return "⚠️ 보통";
  return "🚨 위험";
}

/* 렌더 */
function render(){

  const coins = getCoins();

  const box = document.getElementById("list");
  box.innerHTML = "";

  coins.forEach(c=>{
    box.innerHTML += `
      <div class="coin">
        <span>[${c.day}] ${c.name}</span>
        <span>${c.score}</span>
      </div>
    `;
  });

  const a = avg(coins);

  document.getElementById("avg").innerText = "평균: " + a;
  document.getElementById("grade").innerText = "등급: " + grade(a);
  document.getElementById("burnout").innerText = burnout(a);
}

/* 다음 주 */
function nextWeek(){
  localStorage.removeItem("coins");
  render();
  document.getElementById("startBtn").innerText = "START";
}

/* 리셋 */
function resetAll(){
  localStorage.clear();
  render();
  document.getElementById("startBtn").innerText = "START";
}

/* 공유 */
function share(){

  const coins = getCoins();
  const a = avg(coins);

  const text =
`🪙 직장인 START 코인

평균: ${a}
등급: ${grade(a)}
${burnout(a)}

#직장인코인`;

  if(navigator.share){
    navigator.share({text});
  } else {
    alert(text);
  }
}

render();

</script>

</body>
</html>

</script>

</body>
</html>
