<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>직장인 주간 코인</title>

<style>
body { font-family: sans-serif; background:#f5f5f5; padding:20px; }
h2 { text-align:center; }

.card {
  background:white;
  padding:15px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.coin {
  display:flex;
  justify-content:space-between;
  padding:10px;
  border-bottom:1px solid #eee;
}

button {
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
  font-size:16px;
}

.meta {
  font-weight:bold;
  margin-top:10px;
}

.level {
  font-size:18px;
  text-align:center;
  padding:10px;
  border-radius:10px;
  background:#ffecec;
}
</style>
</head>

<body>

<h2>🪙 직장인 주간 코인</h2>

<div class="card">

  <div id="coins"></div>

  <div class="meta" id="avg"></div>
  <div class="level" id="burnout"></div>
  <div class="meta" id="grade"></div>

  <button onclick="addCoin()">오늘 코인 생성</button>
  <button onclick="share()">SNS 공유</button>
  <button onclick="resetAll()" style="background:#999;">리셋</button>

</div>

<script>

const MAX = 5;
const dayMap = ["일","월","화","수","목","금","토"];

const coinsPool = [
  {name:"칼퇴 성공 코인", score:95},
  {name:"버티기 성공 코인", score:70},
  {name:"회의 생존 코인", score:60},
  {name:"야근 확정 코인", score:30},
  {name:"멘탈 붕괴 코인", score:10}
];

// 저장
function getCoins(){
  return JSON.parse(localStorage.getItem("coins") || "[]");
}

function saveCoins(data){
  localStorage.setItem("coins", JSON.stringify(data));
}

// 코인 생성 (핵심 수정 없음)
function addCoin(){

  let coins = getCoins();

  const now = new Date();
  const day = dayMap[now.getDay()];

  const pick = coinsPool[Math.floor(Math.random()*coinsPool.length)];

  coins.push({
    day,
    name: pick.name,
    score: pick.score
  });

  // 🔥 핵심 유지 (5개 제한)
  if(coins.length > MAX){
    coins = coins.slice(coins.length - MAX);
  }

  saveCoins(coins);
  render();
}

// 평균
function getAvg(coins){
  if(!coins.length) return 0;
  return Math.round(coins.reduce((a,b)=>a+b.score,0)/coins.length);
}

// 번아웃
function burnout(avg){
  if(avg >= 80) return "🔥 번아웃 LOW (상태 좋음)";
  if(avg >= 50) return "⚠️ 보통 (조금 피곤)";
  return "🚨 번아웃 HIGH (위험)";
}

// 등급
function grade(avg){
  if(avg >= 85) return "S등급";
  if(avg >= 70) return "A등급";
  if(avg >= 50) return "B등급";
  return "C등급";
}

// 렌더
function render(){

  const coins = getCoins();
  const box = document.getElementById("coins");

  box.innerHTML = "";

  coins.forEach(c=>{
    box.innerHTML += `
      <div class="coin">
        <span>[${c.day}] ${c.name}</span>
        <span>${c.score}점</span>
      </div>
    `;
  });

  const avg = getAvg(coins);

  document.getElementById("avg").innerText = "평균 점수: " + avg;
  document.getElementById("burnout").innerText = burnout(avg);
  document.getElementById("grade").innerText = "이번 주 평가: " + grade(avg);
}

// SNS 공유
function share(){

  const coins = getCoins();
  const avg = getAvg(coins);

  const text =
`🪙 직장인 주간 코인

평균: ${avg}
평가: ${grade(avg)}
${burnout(avg)}

#직장인코인`;

  if(navigator.share){
    navigator.share({text});
  } else {
    alert(text);
  }
}

// 리셋
function resetAll(){
  localStorage.removeItem("coins");
  render();
}

render();

</script>

</body>
</html>
