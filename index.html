<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

/* =========================
   GLOBAL
========================= */

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI";
  background:#f6f7fb;
  overflow:hidden;
  transition:0.6s;
}

.screen{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.hidden{display:none;}

/* =========================
   GLASS CARD
========================= */

.card{
  background:rgba(255,255,255,0.6);
  backdrop-filter:blur(20px);
  border-radius:30px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,0.1);
}

/* =========================
   BUTTON
========================= */

button{
  padding:12px 20px;
  border:none;
  border-radius:999px;
  background:#6c63ff;
  color:white;
  margin-top:10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
}

/* =========================
   COIN (3D PRO)
========================= */

.coin{
  width:240px;
  height:240px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  position:relative;

  transform-style:preserve-3d;

  box-shadow:
    0 30px 80px rgba(0,0,0,0.2),
    inset 0 8px 20px rgba(255,255,255,0.4);

  transition:0.6s;
}

/* 두께 */
.coin::before{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  border-radius:50%;
  transform:translateZ(-12px);
  background:rgba(0,0,0,0.15);
}

/* 빛 반사 */
.coin::after{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  border-radius:50%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.3),transparent);
  transform:rotate(30deg);
}

/* =========================
   COIN LEVELS
========================= */

.silver{
  background:radial-gradient(circle at 30% 30%,#fff,#cfd8dc,#90a4ae);
}

.gold{
  background:radial-gradient(circle at 30% 30%,#fff4c2,#ffd54f,#caa200);
}

.bronze{
  background:radial-gradient(circle at 30% 30%,#ffd2b3,#c77700,#6d3b1a);
}

.red{
  background:radial-gradient(circle at 30% 30%,#ffb3b3,#ff5252,#7a0000);
}

/* =========================
   ANIMATION
========================= */

@keyframes coinIn{
  0%{
    transform:rotateY(0deg) scale(0.2);
    opacity:0;
  }
  60%{
    transform:rotateY(720deg) scale(1.15);
    opacity:1;
  }
  100%{
    transform:rotateY(720deg) scale(1);
  }
}

.animate{
  animation:coinIn 1.2s ease-out;
}

/* =========================
   LAYOUT
========================= */

.title{
  font-size:20px;
  letter-spacing:4px;
  opacity:0.6;
}

.q{
  font-size:20px;
  margin-bottom:20px;
  text-align:center;
}

.opt{
  display:flex;
  flex-direction:column;
  gap:10px;
}

</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <div class="card">
    <div class="title">DAILY COIN</div>
    <button onclick="start()">START</button>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div class="card">
    <div class="q" id="q"></div>
    <div class="opt" id="opt"></div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div id="coin" class="coin silver">
    <div id="level"></div>
    <div id="score"></div>
  </div>

  <div style="margin-top:15px" id="desc"></div>

  <button onclick="restart()">RETRY</button>
</div>

<script>

/* =========================
   DATA
========================= */

const pool=[
"오늘 기분 어때?","에너지 상태는?","스트레스 있었어?",
"집중 잘 됐어?","피로감 있어?","사람 만나는 건 어때?"
];

const options=[
{t:"좋음",v:0},
{t:"보통",v:1},
{t:"나쁨",v:2},
{t:"최악",v:3}
];

let qs=[],i=0,s=0;

/* =========================
   START
========================= */

function start(){

 qs=[...pool].sort(()=>Math.random()-0.5).slice(0,6);
 i=0;s=0;

 document.getElementById("start").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");

 render();
}

/* =========================
   Q
========================= */

function render(){
 document.getElementById("q").innerText=qs[i];

 const box=document.getElementById("opt");
 box.innerHTML="";

 options.forEach(o=>{
  let b=document.createElement("button");
  b.innerText=o.t;
  b.onclick=()=>ans(o.v);
  box.appendChild(b);
 });
}

/* =========================
   ANSWER
========================= */

function ans(v){
 s+=v;
 i++;

 if(i<qs.length) render();
 else result();
}

/* =========================
   RESULT (APP GRADE)
========================= */

function result(){

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 let percent=Math.round((s/(qs.length*3))*100);

 let level="silver";
 let text="STABLE";

 if(percent<30){level="silver";text="STABLE";}
 else if(percent<50){level="gold";text="GOOD";}
 else if(percent<75){level="bronze";text="TIRED";}
 else{level="red";text="CRITICAL";}

 const coin=document.getElementById("coin");

 coin.className="coin "+level;

 // 🔥 애니메이션 재생
 coin.classList.remove("animate");
 void coin.offsetWidth;
 coin.classList.add("animate");

 document.getElementById("level").innerText=text;
 document.getElementById("score").innerText=percent+"%";

 document.getElementById("desc").innerText=
 text==="CRITICAL"
 ? "휴식이 필요합니다 💭"
 : "오늘 상태: "+text;
}

/* =========================
   RESTART
========================= */

function restart(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
}

</script>

</body>
</html>
