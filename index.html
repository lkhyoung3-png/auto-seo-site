<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, sans-serif;
  background: linear-gradient(135deg, #f7f5ff, #ffffff);
  color: #333;
  overflow: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hidden { display: none; }

/* START */
.logo {
  font-size: 14px;
  letter-spacing: 6px;
  color: #9b5de5;
  margin-bottom: 20px;
}

.hero {
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 30px 80px rgba(155,93,229,0.15);
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 18px;
  color: #9b5de5;
}

.start-btn {
  margin-top: 30px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
}

/* 질문 */
.box {
  width: 85%;
  max-width: 420px;
  background: white;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(155,93,229,0.1);
  text-align: center;
}

.question {
  font-size: 20px;
  margin: 20px 0;
}

.btns {
  display: flex;
  gap: 10px;
}

.btn {
  flex: 1;
  height: 50px;
  border-radius: 14px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
}

/* 결과 */
.result {
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: white;
  box-shadow: 0 30px 80px rgba(155,93,229,0.15);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.score {
  font-size: 50px;
  color: #9b5de5;
}

.desc {
  font-size: 13px;
  opacity: 0.6;
  margin-top: 10px;
}

.action {
  margin-top: 20px;
  width: 160px;
  height: 50px;
  border-radius: 999px;
  background: linear-gradient(145deg, #cdb4ff, #9b5de5);
  color: white;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <div class="logo">DAILY COIN</div>
  <div class="hero">TODAY</div>

  <button class="start-btn" onclick="startQuiz()">
    START
  </button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div class="box">
    <div id="num"></div>
    <div class="question" id="q"></div>

    <div class="btns">
      <button class="btn" onclick="answer(0)">좋음</button>
      <button class="btn" onclick="answer(1)">보통</button>
      <button class="btn" onclick="answer(2)">힘듦</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div class="result" id="capture">
    <div id="state"></div>
    <div class="score" id="score"></div>
    <div class="desc" id="desc"></div>
  </div>

  <button class="action" onclick="save()">SAVE</button>
  <button class="action" onclick="restart()">RETRY</button>

</div>

<script>

/* 질문 */
const pool = [
"오늘 기분 어때?",
"에너지 충분해?",
"스트레스 있었어?",
"쉬고 싶었어?",
"집중 잘 됐어?",
"피곤했어?",
"사람 만나기 어땠어?",
"일 부담됐어?",
"감정 기복 있었어?",
"하루 만족해?",
"무기력했어?",
"긴장했어?",
"의욕 있었어?",
"휴식 필요해?",
"내일 기대돼?"
];

let qs = [];
let i = 0;
let s = 0;

/* START */
function startQuiz(){
  qs = [...pool]
    .sort(() => Math.random() - 0.5)
    .slice(0, 15);

  i = 0;
  s = 0;

  document.getElementById('start').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');

  render();
}

/* 질문 */
function render(){
  document.getElementById('num').innerText = `${i+1}/15`;
  document.getElementById('q').innerText = qs[i];
}

/* 답변 */
function answer(v){
  s += v;
  i++;

  if(i < qs.length){
    render();
  } else {
    result();
  }
}

/* 결과 */
function result(){
  document.getElementById('quiz').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');

  const percent = Math.round((s / (qs.length*2)) * 100);

  let state = "";
  let desc = "";

  if(percent < 40){
    state = "STABLE";
    desc = "괜찮은 하루였어요 🌸";
  } else if(percent < 70){
    state = "WARNING";
    desc = "조금 쉬어가도 좋아요 ☕";
  } else {
    state = "CRITICAL";
    desc = "휴식이 필요합니다 💭";
  }

  document.getElementById('state').innerText = state;
  document.getElementById('score').innerText = percent + "%";
  document.getElementById('desc').innerText = desc;
}

/* 저장 */
function save(){
  html2canvas(document.getElementById('capture')).then(c=>{
    let a = document.createElement('a');
    a.download = "coin.png";
    a.href = c.toDataURL();
    a.click();
  });
}

/* 리셋 */
function restart(){
  document.getElementById('result').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}

</script>

</body>
</html>
