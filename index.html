<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,sans-serif;
  background:linear-gradient(135deg,#faf7ff,#ffffff);
  overflow-x:hidden;
}

.screen{
  width:100vw;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.hidden{display:none;}

/* ===================== */
/* COIN */
/* ===================== */

.coin{
  width:220px;
  height:220px;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  transition:0.4s;

  box-shadow:0 20px 60px rgba(0,0,0,0.15);
}

.coin span{font-weight:300;}

/* 레벨 */
.bronze{background:linear-gradient(145deg,#caa46a,#8c6a3b);}
.silver{background:linear-gradient(145deg,#e6e6e6,#9ea7b3);}
.gold{background:linear-gradient(145deg,#ffe08a,#caa200);}
.platinum{background:linear-gradient(145deg,#d7d7ff,#7b5cff);}

/* ===================== */
/* BUTTON */
/* ===================== */

.btn{
  padding:12px 20px;
  margin:6px;
  border:none;
  border-radius:999px;
  background:#7b5cff;
  color:white;
}

/* ===================== */
/* HISTORY */
/* ===================== */

.history{
  width:90%;
  max-width:420px;
  margin-top:20px;
}

.card{
  background:white;
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  display:flex;
  justify-content:space-between;
}

/* ===================== */
/* INSTALL */
/* ===================== */

.install{
  position:fixed;
  bottom:20px;
  background:#7b5cff;
  color:white;
  padding:10px 16px;
  border-radius:999px;
  display:none;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <h2>DAILY COIN</h2>
  <button class="btn" onclick="start()">START</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div id="q"></div>
  <div id="opt"></div>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div id="coin" class="coin">
    <div id="level"></div>
    <div id="score"></div>
  </div>

  <div id="todayCard"></div>

  <button class="btn" onclick="save()">SAVE</button>
  <button class="btn" onclick="restart()">RETRY</button>

  <div class="history" id="history"></div>

</div>

<button id="installBtn" class="install">📦 앱 설치</button>

<script>

/* ===================== */
/* DATA */
/* ===================== */

const pool=[
"오늘 기분?","에너지?","스트레스?","집중?","피로?","의욕?","마음 상태?"
];

const options=[
{t:"좋음",v:0},
{t:"보통",v:1},
{t:"나쁨",v:2},
{t:"최악",v:3}
];

let qs=[],i=0,s=0;

/* ===================== */
/* DAILY LIMIT */
/* ===================== */

function can(){
 return localStorage.getItem("done")!==new Date().toDateString();
}

/* ===================== */
/* START */
/* ===================== */

function start(){

 if(!can()){
  alert("오늘 완료됨 🌿");
  return;
 }

 qs=[...pool].sort(()=>Math.random()-0.5).slice(0,7);
 i=0;s=0;

 document.getElementById("start").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");

 render();
}

/* ===================== */
/* Q */
/* ===================== */

function render(){
 document.getElementById("q").innerText=qs[i];

 const box=document.getElementById("opt");
 box.innerHTML="";

 options.forEach(o=>{
  let b=document.createElement("button");
  b.className="btn";
  b.innerText=o.t;
  b.onclick=()=>ans(o.v);
  box.appendChild(b);
 });
}

function ans(v){
 s+=v;
 i++;
 if(i<qs.length)render();
 else result();
}

/* ===================== */
/* RESULT + LEVEL */
/* ===================== */

function result(){

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 let percent=Math.round((s/(qs.length*3))*100);

 let level="bronze";

 if(percent<30)level="platinum";
 else if(percent<50)level="gold";
 else if(percent<75)level="silver";

 document.getElementById("coin").className="coin "+level;
 document.getElementById("level").innerText=level.toUpperCase();
 document.getElementById("score").innerText=percent+"%";

 document.getElementById("todayCard").innerHTML=
 "오늘 상태: "+level;

 saveHistory(percent,level);

 localStorage.setItem("done",new Date().toDateString());

 showHistory();
}

/* ===================== */
/* HISTORY (5 DAYS) */
/* ===================== */

function saveHistory(p,l){

 let h=JSON.parse(localStorage.getItem("h")||"[]");

 h.unshift({
  d:new Date().toLocaleDateString(),
  p,l
 });

 h=h.slice(0,5);
 localStorage.setItem("h",JSON.stringify(h));
}

function showHistory(){

 let h=JSON.parse(localStorage.getItem("h")||"[]");

 document.getElementById("history").innerHTML=
 h.map(x=>
 `<div class="card">
  <div>${x.d}</div>
  <div>${x.l} ${x.p}%</div>
 </div>`
 ).join("");
}

/* ===================== */
/* SAVE IMAGE */
/* ===================== */

function save(){
 html2canvas(document.getElementById("coin")).then(c=>{
  let a=document.createElement("a");
  a.download="coin.png";
  a.href=c.toDataURL();
  a.click();
 });
}

/* ===================== */
/* RESTART */
/* ===================== */

function restart(){
 document.getElementById("result").classList.add("hidden");
 document.getElementById("start").classList.remove("hidden");
}

/* ===================== */
/* PWA INSTALL */
/* ===================== */

let deferredPrompt;

window.addEventListener("beforeinstallprompt",(e)=>{
 e.preventDefault();
 deferredPrompt=e;
 document.getElementById("installBtn").style.display="block";
});

document.getElementById("installBtn").onclick=async()=>{
 if(deferredPrompt){
  deferredPrompt.prompt();
  deferredPrompt=null;
 }
};

</script>

</body>
</html>
