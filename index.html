<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  font-family:-apple-system,sans-serif;
  background:linear-gradient(135deg,#faf7ff,#ffffff);
}

.screen{
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.hidden{display:none;}

/* START */
#start h1{
  color:#7b5cff;
  letter-spacing:4px;
}

/* COIN */
.coin{
  width:220px;
  height:220px;
  border-radius:50%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:linear-gradient(145deg,#e9e9ff,#cfc7ff);
  box-shadow:0 20px 60px rgba(0,0,0,0.15);
  transition:0.3s;
}

.bronze{background:linear-gradient(145deg,#caa46a,#8c6a3b);}
.silver{background:linear-gradient(145deg,#e6e6e6,#9ea7b3);}
.gold{background:linear-gradient(145deg,#ffe08a,#caa200);}
.platinum{background:linear-gradient(145deg,#d7d7ff,#7b5cff);}

/* BUTTON */
button{
  margin-top:10px;
  padding:12px 18px;
  border:none;
  border-radius:999px;
  background:#7b5cff;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- START -->
<div id="start" class="screen">
  <h1>DAILY COIN</h1>
  <button onclick="startQuiz()">START</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="screen hidden">
  <div id="q" style="font-size:20px;margin-bottom:20px;"></div>
  <button onclick="answer(0)">좋음</button>
  <button onclick="answer(1)">보통</button>
  <button onclick="answer(2)">나쁨</button>
  <button onclick="answer(3)">최악</button>
</div>

<!-- RESULT -->
<div id="result" class="screen hidden">

  <div id="coin" class="coin">
    <div id="level"></div>
    <div id="score"></div>
  </div>

  <div id="desc" style="margin-top:10px;"></div>

  <button onclick="restart()">RETRY</button>
</div>

<script>

/* ===================== */
/* DATA */
/* ===================== */

const pool=[
"오늘 기분 어때?","에너지 상태는?","스트레스 있었어?",
"집중 잘 됐어?","피로감 있어?"
];

let qs=[];
let i=0;
let s=0;

/* ===================== */
/* 하루 제한 (핵심 수정) */
/* ===================== */

function today(){
  return new Date().toDateString();
}

function canStart(){
  const done = localStorage.getItem("done");
  return done !== today();
}

/* ===================== */
/* START (핵심 안정화) */
/* ===================== */

function startQuiz(){

  console.log("START CLICK");

  if(!canStart()){
    alert("오늘은 이미 완료했어요 🌿");
    return;
  }

  qs = [...pool].sort(()=>Math.random()-0.5).slice(0,5);
  i=0;
  s=0;

  document.getElementById("start").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");

  render();
}

/* ===================== */
/* QUESTION */
/* ===================== */

function render(){
  document.getElementById("q").innerText = qs[i];
}

/* ===================== */
/* ANSWER */
/* ===================== */

function answer(v){
  s += v;
  i++;

  if(i < qs.length){
    render();
  } else {
    result();
  }
}

/* ===================== */
/* RESULT */
/* ===================== */

function result(){

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  const percent = Math.round((s/(qs.length*3))*100);

  let level="bronze";
  let text="OK";

  if(percent < 30){ level="platinum"; text="좋음 🌿"; }
  else if(percent < 50){ level="gold"; text="보통 ☕"; }
  else if(percent < 75){ level="silver"; text="피로 ⚠"; }
  else { level="bronze"; text="위험 💭"; }

  document.getElementById("coin").className="coin "+level;
  document.getElementById("level").innerText=level.toUpperCase();
  document.getElementById("score").innerText=percent+"%";
  document.getElementById("desc").innerText=text;

  /* 🔥 하루 완료 저장 */
  localStorage.setItem("done", today());
}

/* ===================== */
/* RESTART */
/* ===================== */

function restart(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("start").classList.remove("hidden");
}

</script>

</body>
</html>
