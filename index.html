<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>DAILY COIN</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#090b10;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  overflow:hidden;
}

/* 공통 */

.screen{
  width:100vw;
  height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  position:relative;
  padding:24px;
}

.hidden{
  display:none;
}

button{
  border:none;
  outline:none;
  cursor:pointer;
  color:white;
  font-family:inherit;
}

/* 랜딩 */

.bg{
  position:absolute;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(60px);

  background:
  radial-gradient(circle,
  rgba(130,140,255,0.18),
  transparent 70%);

  animation:pulse 6s ease-in-out infinite;
}

@keyframes pulse{
  0%{
    transform:scale(1);
    opacity:.5;
  }

  50%{
    transform:scale(1.15);
    opacity:.9;
  }

  100%{
    transform:scale(1);
    opacity:.5;
  }
}

.logo{
  position:relative;
  z-index:2;

  letter-spacing:8px;
  font-size:12px;
  opacity:.5;

  margin-bottom:40px;
}

.hero-coin{
  width:230px;
  height:230px;

  border-radius:50%;

  position:relative;
  z-index:2;

  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.25),
  transparent 60%),

  linear-gradient(145deg,
  #1a2030,
  #090c12);

  box-shadow:
  0 50px 120px rgba(0,0,0,.8),
  inset 0 1px 0 rgba(255,255,255,.08);

  animation:float 4s ease-in-out infinite;
}

.hero-coin::before{
  content:"";

  position:absolute;
  width:180%;
  height:180%;

  top:-40%;
  left:-40%;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );

  transform:rotate(25deg);
}

@keyframes float{
  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-12px);
  }

  100%{
    transform:translateY(0px);
  }
}

.hero-text{
  font-size:18px;
  letter-spacing:4px;
  font-weight:200;
}

.sub{
  position:relative;
  z-index:2;

  margin-top:40px;

  font-size:14px;
  opacity:.5;
}

.start-btn{
  position:relative;
  z-index:2;

  margin-top:30px;

  width:180px;
  height:54px;

  border-radius:999px;

  background:
  linear-gradient(145deg,
  #222838,
  #141821);

  letter-spacing:3px;

  box-shadow:
  0 20px 40px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.06);

  transition:.25s;
}

.start-btn:hover{
  transform:translateY(-2px);
}

/* 질문 */

.progress{
  position:absolute;
  top:70px;

  width:70%;
  height:4px;

  border-radius:999px;

  background:rgba(255,255,255,.08);
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;

  background:
  linear-gradient(90deg,#7d8cff,#c1c7ff);

  transition:.4s;
}

.question-box{
  width:100%;
  max-width:450px;

  padding:40px 30px;

  border-radius:30px;

  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.04),
  transparent 60%),

  linear-gradient(145deg,
  #11141c,
  #090b10);

  box-shadow:
  0 30px 80px rgba(0,0,0,.7),
  inset 0 1px 0 rgba(255,255,255,.04);

  text-align:center;

  animation:fadeUp .5s ease;
}

@keyframes fadeUp{
  0%{
    opacity:0;
    transform:translateY(12px);
  }

  100%{
    opacity:1;
    transform:translateY(0);
  }
}

.question-number{
  font-size:12px;
  letter-spacing:3px;
  opacity:.45;
}

.question-text{
  margin-top:28px;

  font-size:24px;
  line-height:1.5;
  font-weight:250;
}

.answer-wrap{
  margin-top:40px;

  display:flex;
  gap:14px;
}

.answer-btn{
  flex:1;
  height:56px;

  border-radius:18px;

  background:
  linear-gradient(145deg,
  #1a2030,
  #10131a);

  letter-spacing:2px;
  font-size:13px;

  transition:.25s;
}

.answer-btn:hover{
  transform:translateY(-2px);
}

/* 결과 */

.result-wrap{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.result-coin{
  width:320px;
  height:320px;

  border-radius:50%;

  position:relative;
  overflow:hidden;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  box-shadow:
  0 60px 120px rgba(0,0,0,.8),
  inset 0 1px 0 rgba(255,255,255,.08);

  animation:float 4s ease-in-out infinite;
}

.result-coin::before{
  content:"";

  position:absolute;

  width:180%;
  height:180%;

  top:-40%;
  left:-40%;

  background:
  linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,.08),
    transparent
  );

  transform:rotate(25deg);
}

.result-title{
  font-size:12px;
  letter-spacing:5px;
  opacity:.45;
}

.result-state{
  margin-top:18px;

  font-size:24px;
  font-weight:200;
  letter-spacing:2px;

  text-align:center;
}

.result-score{
  margin-top:16px;

  font-size:58px;
  font-weight:100;
}

.result-desc{
  margin-top:18px;

  font-size:13px;
  opacity:.6;

  text-align:center;
  line-height:1.5;
}

.result-buttons{
  margin-top:40px;

  display:flex;
  gap:14px;
}

.action-btn{
  width:170px;
  height:52px;

  border-radius:999px;

  background:
  linear-gradient(145deg,
  #222838,
  #141821);

  letter-spacing:2px;

  box-shadow:
  0 20px 40px rgba(0,0,0,.45),
  inset 0 1px 0 rgba(255,255,255,.06);

  transition:.25s;
}

.action-btn:hover{
  transform:translateY(-2px);
}

/* 코인 테마 */

.moon{
  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.28),
  transparent 60%),

  linear-gradient(145deg,
  #6d7cff,
  #111827);
}

.calm{
  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.35),
  transparent 60%),

  linear-gradient(145deg,
  #dfe7ff,
  #6b7280);
}

.burnout{
  background:
  radial-gradient(circle at top,
  rgba(255,120,120,.3),
  transparent 60%),

  linear-gradient(145deg,
  #3a0d0d,
  #090909);
}

.chaos{
  background:
  radial-gradient(circle at top,
  rgba(180,120,255,.3),
  transparent 60%),

  linear-gradient(145deg,
  #27113f,
  #0b0811);
}

.cloud{
  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.22),
  transparent 60%),

  linear-gradient(145deg,
  #6b7280,
  #1f2937);
}

.focus{
  background:
  radial-gradient(circle at top,
  rgba(120,220,255,.25),
  transparent 60%),

  linear-gradient(145deg,
  #123447,
  #081018);
}

.recovery{
  background:
  radial-gradient(circle at top,
  rgba(170,255,220,.28),
  transparent 60%),

  linear-gradient(145deg,
  #173a31,
  #09100d);
}

.silent{
  background:
  radial-gradient(circle at top,
  rgba(255,255,255,.18),
  transparent 60%),

  linear-gradient(145deg,
  #1f2937,
  #090b10);
}

@media(max-width:500px){

  .question-text{
    font-size:20px;
  }

  .result-coin{
    width:270px;
    height:270px;
  }

  .result-score{
    font-size:48px;
  }

  .result-buttons{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<!-- 랜딩 -->

<section id="landing" class="screen">

  <div class="bg"></div>

  <div class="logo">
    DAILY COIN
  </div>

  <div class="hero-coin">
    <div class="hero-text">
      TODAY
    </div>
  </div>

  <div class="sub">
    오늘의 감정 상태를 확인하세요
  </div>

  <button class="start-btn" onclick="startQuiz()">
    START
  </button>

</section>

<!-- 질문 -->

<section id="quiz" class="screen hidden">

  <div class="progress">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="question-box">

    <div class="question-number" id="questionNumber"></div>

    <div class="question-text" id="questionText"></div>

    <div class="answer-wrap">

      <button class="answer-btn" onclick="answer(0)">
        NO
      </button>

      <button class="answer-btn" onclick="answer(1)">
        YES
      </button>

    </div>

  </div>

</section>

<!-- 결과 -->

<section id="result" class="screen hidden">

  <div class="result-wrap" id="captureArea">

    <div class="result-coin" id="resultCoin">

      <div class="result-title">
        DAILY COIN
      </div>

      <div class="result-state" id="resultState"></div>

      <div class="result-score" id="resultScore"></div>

      <div class="result-desc" id="resultDesc"></div>

    </div>

  </div>

  <div class="result-buttons">

    <button class="action-btn" onclick="saveCoin()">
      SAVE COIN
    </button>

    <button class="action-btn" onclick="restartQuiz()">
      RETRY
    </button>

  </div>

</section>

<script>

/* 질문 */

const questionPool = [

"출근 생각만 해도 피곤하다",
"업무 시작이 자꾸 늦어진다",
"요즘 집중이 잘 안 된다",
"쉬어도 회복이 느리다",
"혼자 있고 싶은 날이 많다",
"업무가 버겁게 느껴진다",
"사람들과 대화가 귀찮다",
"생각이 너무 많아진다",
"자꾸 멍해지는 순간이 있다",
"예전보다 의욕이 줄었다",
"잠을 자도 개운하지 않다",
"하루가 너무 빨리 소모된다",
"감정 기복이 심해진 느낌이다",
"지금 모든 걸 멈추고 싶다",
"작은 일에도 쉽게 지친다",
"일상이 반복처럼 느껴진다",
"회복이 필요한 느낌이다",
"혼자 조용히 쉬고 싶다",
"무기력한 순간이 많다",
"아무 생각 없이 있고 싶다",
"미래 생각이 조금 막막하다",
"쉬는 날에도 긴장이 남아있다",
"감정 소비가 커진 느낌이다",
"지금은 천천히 가고 싶다",
"생각 정리가 잘 안 된다"

]

/* 코인 */

const coinTypes = [

{
  name:"MOON COIN",
  class:"moon",
  desc:"생각이 많아지는 새벽 감성의 상태"
},

{
  name:"CALM COIN",
  class:"calm",
  desc:"잔잔하게 균형이 유지되는 흐름"
},

{
  name:"BURNOUT COIN",
  class:"burnout",
  desc:"에너지가 거의 소진된 상태"
},

{
  name:"CHAOS COIN",
  class:"chaos",
  desc:"생각과 일정이 뒤엉킨 흐름"
},

{
  name:"CLOUD COIN",
  class:"cloud",
  desc:"마음이 조금 흐려진 상태"
},

{
  name:"FOCUS COIN",
  class:"focus",
  desc:"집중 흐름이 강해진 상태"
},

{
  name:"RECOVERY COIN",
  class:"recovery",
  desc:"조금씩 회복이 시작되는 상태"
},

{
  name:"SILENT COIN",
  class:"silent",
  desc:"혼자만의 시간이 필요한 상태"
}

]

let questions = []
let current = 0
let score = 0

/* 시드 */

function getSeed(){

  const d = new Date()

  return d.getFullYear()
  + d.getMonth()
  + d.getDate()

}

/* 시드 셔플 */

function seededShuffle(array, seed){

  const arr = [...array]

  for(let i = arr.length - 1; i > 0; i--){

    const j = Math.floor(
      ((Math.sin(seed + i) * 10000) % 1 + 1) % 1 * (i + 1)
    )

    ;[arr[i], arr[j]] = [arr[j], arr[i]]

  }

  return arr

}

/* 질문 생성 */

function generateQuestions(){

  questions =
  seededShuffle(questionPool, getSeed())
  .slice(0,15)

}

/* 시작 */

function startQuiz(){

  generateQuestions()

  current = 0
  score = 0

  document
  .getElementById('landing')
  .classList.add('hidden')

  document
  .getElementById('quiz')
  .classList.remove('hidden')

  renderQuestion()

}

/* 렌더 */

function renderQuestion(){

  document
  .getElementById('questionNumber')
  .innerText =
  `${current + 1} / ${questions.length}`

  document
  .getElementById('questionText')
  .innerText =
  questions[current]

  const percent =
  (current / questions.length) * 100

  document
  .getElementById('progressFill')
  .style.width =
  `${percent}%`

}

/* 답변 */

function answer(value){

  score += value
  current++

  if(current < questions.length){

    renderQuestion()

  }else{

    showResult()

  }

}

/* 결과 */

function showResult(){

  document
  .getElementById('quiz')
  .classList.add('hidden')

  document
  .getElementById('result')
  .classList.remove('hidden')

  const percent =
  Math.round((score / questions.length) * 100)

  const result =
  coinTypes[
    (score + getSeed()) % coinTypes.length
  ]

  const coin =
  document.getElementById('resultCoin')

  coin.className =
  `result-coin ${result.class}`

  document
  .getElementById('resultState')
  .innerText =
  result.name

  document
  .getElementById('resultScore')
  .innerText =
  `${percent}%`

  document
  .getElementById('resultDesc')
  .innerText =
  result.desc

}

/* 저장 */

function saveCoin(){

  html2canvas(
    document.getElementById('captureArea'),
    {
      backgroundColor:null,
      scale:4
    }
  ).then(canvas=>{

    const link =
    document.createElement('a')

    link.download =
    'daily-coin.png'

    link.href =
    canvas.toDataURL()

    link.click()

  })

}

/* 다시 */

function restartQuiz(){

  document
  .getElementById('result')
  .classList.add('hidden')

  document
  .getElementById('landing')
  .classList.remove('hidden')

}

</script>

</body>
</html>
